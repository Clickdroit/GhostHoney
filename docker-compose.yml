version: '3.8'

services:
  ghosthoney:
    build: .
    container_name: ghosthoney
    restart: unless-stopped
    ports:
      - "8000:8000"   # Web dashboard & HTTP trap
      - "2222:2222"   # Fake SSH Honeypot
      - "2323:2323"   # Fake Telnet Honeypot
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
